# Workspace root manifest for obsbot-control.
# Member crates are added by T-005 (obsbot-core), T-006 (obsbot-cli),
# T-007 (obsbot-gui). Shared metadata and pinned dependency versions
# live here so member crates can opt in via `workspace = true`.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"
authors = ["Domatix and contributors"]
repository = "https://github.com/Domatix/obsbot-control"
homepage = "https://github.com/Domatix/obsbot-control"

[workspace.dependencies]
# GUI stack (used by obsbot-gui from T-007).
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_6"] }
glib = "0.20"
gio = "0.20"

# GStreamer preview pipeline (used by obsbot-gui from v0.3 / T-200+).
gstreamer = "0.23"
gstreamer-video = "0.23"
gstreamer-app = "0.23"

# Camera access (used by obsbot-core from T-005/T-011 onwards).
v4l = "0.14"
nusb = "0.1"
# nix's `feat-ioctl` macros are how `obsbot-core::xu` issues
# `UVCIOC_CTRL_QUERY` against the kernel uvcvideo driver (T-300).
nix = { version = "0.29", features = ["ioctl"] }

# Error handling. thiserror for library crates, anyhow for binaries.
thiserror = "2"
anyhow = "1"

# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing (used by obsbot-cli from T-006).
clap = { version = "4", features = ["derive"] }

# Cross-thread comms with the GLib main loop, per ADR-0004 (no Tokio).
async-channel = "2"

# i18n (scaffolding landed in T-107; translation polish is v0.6 / T-500+).
gettext-rs = { version = "0.7", features = ["gettext-system"] }

# Test-only: mock sysfs / filesystem trees (used by obsbot-core's
# enumeration unit tests from T-011).
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
