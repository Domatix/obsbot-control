[package]
name = "obsbot-gui"
description = "GTK4 + libadwaita graphical interface for Obsbot Cam Control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Binary name follows ADR-0012 (kebab-case of the App ID's last segment).
# The crate name (`obsbot-gui`) stays as a workspace handle; `cargo run
# -p obsbot-gui` and `obsbot-cam-control` (installed) refer to the same
# program.
[[bin]]
name = "obsbot-cam-control"
path = "src/main.rs"

[dependencies]
obsbot-core = { path = "../obsbot-core" }
# `gtk4` and `libadwaita` are aliased to `gtk` / `adw` at the source-file
# level via `use ... as ...` (the gtk-rs idiom); the workspace pin stays
# authoritative.
gtk4.workspace = true
libadwaita.workspace = true
glib.workspace = true
gio.workspace = true

# GStreamer pipeline for the live preview (T-200). Gated behind
# the `live-preview` Cargo feature (off by default) so the workspace
# stays buildable on hosts that have not installed
# `libgstreamer1.0-dev` + `gstreamer1.0-gtk4` system packages. The
# Flatpak manifest will enable the feature once T-200 lands the
# matching plugin packages in `flathub.yaml`; on the user's dev
# machine `cargo run -p obsbot-gui --features live-preview` opts
# in. See PLAN.md §T-200 for the install incantation.
gstreamer = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
# `thiserror` only needed when the live-preview module compiles
# (PreviewError derives `thiserror::Error`). Off by default to keep
# the no-feature build dependency-free of error-handling helpers.
thiserror = { workspace = true, optional = true }

# gettext binding (T-107). The scaffolding routes user-facing
# strings through libintl; .po → .mo compilation is handled by
# `po/meson.build` via `i18n.gettext()`.
gettext-rs.workspace = true

[features]
# Default build excludes the live-preview pipeline so the standard
# `cargo build` / `cargo test --workspace` flow works without the
# GStreamer dev packages. Enable with `--features live-preview`.
default = []
live-preview = [
    "dep:gstreamer",
    "dep:gstreamer-video",
    "dep:gstreamer-app",
    "dep:thiserror",
]

# Build script (T-099) compiles Blueprint templates and bundles
# the resulting .ui files into a GResource. `glib-build-tools`
# tracks the `glib` / `gio` 0.20 pin from the workspace.
[build-dependencies]
glib-build-tools = "0.20"

# cargo-deb metadata (T-016).
#
# Produces the convenience `.deb` per [[docs/DECISIONS.md ADR-0015]].
# Build via `build-aux/build-deb.sh` (NOT bare `cargo deb`): the wrapper
# `meson setup`s `builddir/` first so `configure_file()` substitutes
# @APP_ID@ / @VERSION@ in the desktop + metainfo templates before
# cargo-deb collects them. Asset paths below resolve relative to this
# manifest dir (`crates/obsbot-gui/`), so generated files reach in via
# `../../builddir/...` and unmodified ones via `../../data/...`.
[package.metadata.deb]
name = "obsbot-cam-control"
maintainer = "Domatix and contributors <noreply@domatix.com>"
copyright = "2026, Domatix and contributors"
license-file = ["../../LICENSE", "0"]
section = "video"
priority = "optional"
extended-description = """\
Native GNOME application to control OBSBOT Tiny 2 family webcams \
(Tiny 2 and Tiny 2 Lite) over UVC/V4L2. Pre-alpha v0.1 build: \
camera enumeration plus a diagnostics view exposing the V4L2 \
controls the kernel exports. This is an unofficial test package; \
Flatpak via Flathub is the supported distribution channel."""
depends = "$auto"
assets = [
    ["target/release/obsbot-cam-control", "usr/bin/", "755"],
    ["../../builddir/data/io.github.domatix.ObsbotCamControl.desktop", "usr/share/applications/", "644"],
    ["../../builddir/data/io.github.domatix.ObsbotCamControl.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/icons/scalable/apps/io.github.domatix.ObsbotCamControl.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../data/icons/symbolic/apps/io.github.domatix.ObsbotCamControl-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]
