# cargo-audit configuration (T-224).
#
# Read by `cargo audit` and by the `rustsec/audit-check` action in
# `.github/workflows/ci.yml`. Every entry under `ignore` needs a reason
# and a way out; an ignore without either becomes permanent by accident.

[advisories]
ignore = [
    # RUSTSEC-2024-0436 — `paste` is unmaintained (the author archived
    # the repository). Not a vulnerability.
    #
    # Reaches us through gstreamer 0.23.7 and its own dependency
    # option-operations 0.5.0, so it is present in every package we ship
    # (all three enable `live-preview`):
    #
    #   $ cargo tree -p obsbot-gui --features live-preview -i paste
    #   paste v1.0.15 (proc-macro)
    #   ├── gstreamer v0.23.7
    #   └── option-operations v0.5.0
    #       └── gstreamer v0.23.7
    #
    # It is a procedural macro: it runs at compile time and contributes
    # no runtime attack surface.
    #
    # Way out: drop this entry when the gstreamer crates release a
    # version that no longer depends on `paste`. Re-check on every
    # gstreamer bump.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0190 — `anyhow` < 1.0.103 has an unsoundness bug in
    # `Error::downcast_mut()`. Not a vulnerability; it requires the
    # caller to misuse the API in a specific pattern.
    #
    # Reaches us through: wit-bindgen -> wasip2/wasip3 -> getrandom ->
    # tempfile, all WASI-only. tempfile is a dev-dependency. This path
    # does not reach any Linux binary we ship. (cargo-audit does not
    # filter by target_os, so it reports the advisory anyway.)
    #
    # Way out: drop this entry when Cargo.lock bumps anyhow to >= 1.0.103.
    "RUSTSEC-2026-0190",
]

# Everything else fails the build.
