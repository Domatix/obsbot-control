<!-- Placeholder app icon (T-010). Adwaita palette; webcam silhouette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Camera body -->
  <rect x="20" y="20" width="88" height="68" rx="14" ry="14" fill="#3584e4"/>
  <rect x="20" y="20" width="88" height="68" rx="14" ry="14" fill="none" stroke="#1a5fb4" stroke-width="2"/>

  <!-- Lens stack: outer ring → barrel → optical element → sensor dot → highlight -->
  <circle cx="64" cy="54" r="26" fill="#1a5fb4"/>
  <circle cx="64" cy="54" r="20" fill="#241f31"/>
  <circle cx="64" cy="54" r="14" fill="#3d3846"/>
  <circle cx="64" cy="54" r="6" fill="#1c71d8"/>
  <ellipse cx="58" cy="48" rx="6" ry="4" fill="#ffffff" opacity="0.5"/>

  <!-- Tally LED -->
  <circle cx="96" cy="32" r="4" fill="#e01b24"/>
  <circle cx="94.5" cy="30.5" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Mounting neck and base -->
  <rect x="56" y="88" width="16" height="14" fill="#1a5fb4"/>
  <rect x="32" y="100" width="64" height="10" rx="3" fill="#1a5fb4"/>
  <rect x="32" y="100" width="64" height="10" rx="3" fill="none" stroke="#1c3148" stroke-width="1"/>
</svg>
