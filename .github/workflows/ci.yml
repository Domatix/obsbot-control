name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege for every job (T-224). Jobs here run code that arrives
# from pull-request branches (build.rs, build-aux/*.sh), so they must not
# inherit a write-capable token from the repository default. The single
# job that needs to write, `release`, declares its own permission below.
permissions:
  contents: read

# A new push to the same ref supersedes the run in flight. Tag runs are
# excluded: they publish a release and must never be cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA rather than by tag: a tag can be moved
# in the action's own repository, and these run with access to the build.
# The trailing comment carries the human-readable version so upgrades stay
# reviewable. Newer majors exist (checkout v7, artifact v7/v8); moving to
# them is a separate change with its own testing.

jobs:
  cargo:
    name: fmt + clippy + test
    # Fedora 42 ships GTK 4.18 + libadwaita 1.7, satisfying the
    # workspace's libadwaita >= 1.6 requirement (Ubuntu 24.04's 1.5
    # does not).
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo rustfmt clippy git clang-libs \
            gtk4-devel libadwaita-devel \
            blueprint-compiler gettext-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The rustsec/audit-check action posts check-run annotations when it
    # finds informational warnings (unmaintained, unsound, …). Without
    # `checks: write` the API call fails and the job breaks.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Checks Cargo.lock against the RustSec advisory database. Ignored
      # advisories and the reason for each live in `.cargo/audit.toml`,
      # which this action reads automatically.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    name: Flatpak build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --install-deps-from=flathub \
            build-flatpak-ci \
            build-aux/io.github.domatix.obsbot-control.json

  deb:
    name: .deb test artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo git meson ninja-build clang-libs \
            gtk4-devel libadwaita-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            blueprint-compiler gettext-devel desktop-file-utils
          # Exact version, not a caret range: a future 2.x lands in the
          # build without review otherwise.
          cargo install cargo-deb --locked --version '=2.10.0'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the .deb
        run: ./build-aux/build-deb.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: build-aux/dist/*.deb

  arch-pkg:
    name: Arch .pkg.tar.zst test artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm base-devel rust meson clang pkgconf \
            gtk4 libadwaita git blueprint-compiler \
            desktop-file-utils gtk-update-icon-cache \
            gst-plugins-base gst-plugins-good gst-plugin-gtk4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the package (as unprivileged user; makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && ./build-aux/build-arch.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-pkg
          path: build-aux/dist/*.pkg.tar.zst

  cachyos-pkg:
    name: CachyOS .pkg.tar.zst test artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Official CachyOS image (x86-64). Same shape as `arch-pkg`: CachyOS is
    # an Arch derivative, so it ships the same pacman/makepkg toolchain and
    # `build-aux/build-arch.sh` already detects it via `ID=cachyos`. The
    # artifact is built against CachyOS's own repositories so CachyOS
    # testers sideload a package linked against their distro's package set.
    container: cachyos/cachyos:latest
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm base-devel rust meson clang pkgconf \
            gtk4 libadwaita git blueprint-compiler \
            desktop-file-utils gtk-update-icon-cache \
            gst-plugins-base gst-plugins-good gst-plugin-gtk4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the package (as unprivileged user; makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && ./build-aux/build-arch.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cachyos-pkg
          path: build-aux/dist/*.pkg.tar.zst

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, arch-pkg, cachyos-pkg]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      # `arch-pkg` and `cachyos-pkg` both produce a package named after
      # pkgname/pkgver/pkgrel, so give the CachyOS one a suffix or the two
      # would collide as release assets. The Arch artifact keeps its name.
      - name: Disambiguate the CachyOS artifact
        run: |
          mv dist/cachyos-pkg/*.pkg.tar.zst \
            dist/cachyos-pkg/obsbot-control-cachyos.pkg.tar.zst
      # Downstream users have no way to tell whether the binaries they
      # pull match what CI built. Publish checksums alongside them.
      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name '*.deb' -o -name '*.pkg.tar.zst' \) \
            -exec sha256sum {} + | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            dist/**/*.deb dist/**/*.pkg.tar.zst dist/SHA256SUMS \
            --title "$tag" \
            --notes "See the AppStream metainfo for release notes. Test artifacts per ADR-0015: Flatpak via Flathub is the supported channel. Verify downloads against SHA256SUMS."
